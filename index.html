            width: 24px;
            height: 24px;

            100% { transform: rotate(360deg); }

        #backToTop {
            opacity: 0;

        #backToTop.show {

        }

            transform: translateX(-100%);

        #sidebar-overlay {
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;

        #sidebar-overlay.open {

            if (saved === 'true') {

            }
            const savedFont = parseInt(localStorage.getItem('fontSize') || '1');
            state.fontSizeLevel = savedFont;

            state.darkMode = !state.darkMode;

            state.fontSizeLevel = (state.fontSizeLevel + 1) % 4;

                headerBtn.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="text-xl">${category.icon}</span>
                        <span class="font-bold text-sm">${category.name}</span>
                    </div>
                    <i class="fas fa-chevron-down transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}"></i>
                `;
                
                // 子目录容器
                const childrenDiv = document.createElement('div');
                childrenDiv.id = folderId;
                childrenDiv.className = `folder-content ml-4 mt-1 space-y-1 ${isExpanded ? 'open' : ''}`;
                
                category.children.forEach((item, itemIndex) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'tree-line relative';
                    
                    const itemBtn = document.createElement('button');
                    itemBtn.className = 'w-full text-left p-2.5 pl-4 rounded-lg text-sm text-gray-600 hover:bg-primary-50 hover:text-primary-700 transition-colors flex items-center justify-between group';
                    
                    // 生成页码链接
                    let pageLinks = '';
                    if (item.pages > 1) {
                        pageLinks = `<div class="flex gap-1 mt-1.5 ml-6">`;
                        for (let i = 1; i <= item.pages; i++) {
                            const pagePath = item.path.endsWith('/') ? `${item.path}${i}.html` : item.path;
                            pageLinks += `<a href="${pagePath}" onclick="addRecent('${item.name}', '${pagePath}', '${category.icon}')" class="text-xs px-2 py-0.5 rounded bg-primary-50 text-primary-600 hover:bg-primary-200 transition-colors">${i}</a>`;
                        }
                        pageLinks += `</div>`;
                    } else {
                        pageLinks = `<div class="mt-1.5 ml-6"><a href="${item.path}" onclick="addRecent('${item.name}', '${item.path}', '${category.icon}')" class="text-xs px-2 py-0.5 rounded bg-primary-50 text-primary-600 hover:bg-primary-200 transition-colors">1</a></div>`;
                    }
                    
                    itemBtn.innerHTML = `
                        <div class="flex-1">
                            <div class="flex items-center gap-2">
                                <span class="w-1.5 h-1.5 rounded-full bg-primary-300 group-hover:bg-primary-500 transition-colors"></span>
                                <span class="truncate">${item.name}</span>
                            </div>
                            ${pageLinks}
                        </div>
                        <span class="text-xs text-gray-400 ml-2 shrink-0">[${item.pages}页]</span>
                    `;
                    
                    itemDiv.appendChild(itemBtn);
                    childrenDiv.appendChild(itemDiv);
                });
                
                categoryDiv.appendChild(headerBtn);
                categoryDiv.appendChild(childrenDiv);
                nav.appendChild(categoryDiv);
            });
        }

        function toggleFolder(folderId) {
            const folder = document.getElementById(folderId);
            const isOpen = folder.classList.contains('open');
            
            if (isOpen) {
                folder.classList.remove('open');
                state.expandedFolders.delete(folderId);
            } else {
                folder.classList.add('open');
                state.expandedFolders.add(folderId);
            }
            
            renderSidebar(); // 重新渲染以更新箭头方向
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebar-overlay').classList.toggle('open');
        }

        // ==========================================
        // 主页大分类
        // ==========================================
        function renderCategories() {
            const grid = document.getElementById('category-grid');
            grid.innerHTML = '';
            
            archiveData.forEach(category => {
                const totalItems = category.children.length;
                const totalPages = category.children.reduce((sum, item) => sum + item.pages, 0);
                
                const card = document.createElement('div');
                card.className = 'category-card bg-white rounded-2xl p-5 border border-primary-100 cursor-pointer hover:border-primary-300';
                card.onclick = () => showCategory(category.id);
                
                card.innerHTML = `
                    <div class="flex items-start justify-between mb-3">
                        <span class="text-4xl">${category.icon}</span>
                        <span class="text-xs font-medium text-primary-600 bg-primary-50 px-2 py-1 rounded-full">${totalItems}个帖子</span>
                    </div>
                    <h3 class="font-bold text-gray-800 mb-1 text-lg">${category.name}</h3>
                    <p class="text-sm text-gray-500">共 ${totalPages} 页内容</p>
                    <div class="mt-3 flex items-center text-primary-600 text-sm font-medium">
                        <span>进入浏览</span>
                        <i class="fas fa-arrow-right ml-1 text-xs transition-transform group-hover:translate-x-1"></i>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }

        // ==========================================
        // 分类内容展示
        // ==========================================
        function showCategory(categoryId) {
            state.currentCategory = categoryId;
            state.currentPage = 1;
            
            const category = archiveData.find(c => c.id === categoryId);
            if (!category) return;
            
            // 更新内容区标题
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = `
                <div class="flex items-center gap-3 mb-6">
                    <span class="text-3xl">${category.icon}</span>
                    <div>
                        <h2 class="text-xl font-bold text-gray-800">${category.name}</h2>
                        <p class="text-sm text-gray-500">共 ${category.children.length} 个主题</p>
                    </div>
                </div>
                <div id="items-list" class="space-y-3"></div>
            `;
            
            renderItems();
            updatePagination();
            
            // 添加浏览记录
            addRecent(category.name, `#category-${categoryId}`, category.icon);
        }

        function renderItems() {
            const category = archiveData.find(c => c.id === state.currentCategory);
            if (!category) return;
            
            const list = document.getElementById('items-list');
            if (!list) return;
            
            const start = (state.currentPage - 1) * state.itemsPerPage;
            const end = start + state.itemsPerPage;
            const items = category.children.slice(start, end);
            
            list.innerHTML = '';
            
            items.forEach((item, index) => {
                const itemCard = document.createElement('div');
                itemCard.className = 'bg-white rounded-xl p-4 border border-primary-100 hover:shadow-md transition-all hover:border-primary-200';
                
                // 生成页码按钮
                let pagesHtml = '';
                if (item.pages === 1) {
                    pagesHtml = `<a href="${item.path}" onclick="addRecent('${item.name}', '${item.path}', '${category.icon}')" class="inline-flex items-center px-3 py-1.5 rounded-lg bg-primary-50 text-primary-700 text-sm font-medium hover:bg-primary-100 transition-colors">阅读</a>`;
                } else {
                    pagesHtml = `<div class="flex flex-wrap gap-2">`;
                    for (let i = 1; i <= item.pages; i++) {
                        const pagePath = item.path.endsWith('/') ? `${item.path}${i}.html` : item.path;
                        pagesHtml += `<a href="${pagePath}" onclick="addRecent('${item.name} - 第${i}页', '${pagePath}', '${category.icon}')" class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-primary-50 text-primary-700 text-sm font-medium hover:bg-primary-100 transition-colors">${i}</a>`;
                    }
                    pagesHtml += `</div>`;
                }
                
                // 子项目（如Dia的补充）
                let subItemsHtml = '';
                if (item.subItems) {
                    subItemsHtml = `<div class="mt-2 pl-4 border-l-2 border-primary-200 space-y-1">`;
                    item.subItems.forEach(sub => {
                        subItemsHtml += `<div class="text-xs text-gray-500">└ ${sub}</div>`;
                    });
                    subItemsHtml += `</div>`;
                }
                
                itemCard.innerHTML = `
                    <div class="flex items-start justify-between mb-3">
                        <div class="flex-1">
                            <h3 class="font-bold text-gray-800 mb-1">${item.name}</h3>
                            <span class="text-xs text-gray-400">[${item.pages}页]</span>
                        </div>
                        ${item.hasFiles ? '<span class="text-xs bg-yellow-100 text-yellow-700 px-2 py-1 rounded-full">含附件</span>' : ''}
                    </div>
                    ${subItemsHtml}
                    <div class="mt-3">
                        ${pagesHtml}
                    </div>
                `;
                
                list.appendChild(itemCard);
            });
            
            // 显示/隐藏加载和到底提示
            const loading = document.getElementById('loading-indicator');
            const end = document.getElementById('end-indicator');
            
            if (items.length === 0) {
                loading.classList.add('hidden');
                end.classList.remove('hidden');
            } else if (end >= category.children.length) {
                loading.classList.add('hidden');
                end.classList.remove('hidden');
            } else {
                loading.classList.add('hidden');
                end.classList.add('hidden');
            }
        }

        // ==========================================
        // 分页
        // ==========================================
        function updatePagination() {
            const category = archiveData.find(c => c.id === state.currentCategory);
            if (!category) {
                document.getElementById('current-page').textContent = '1';
                document.getElementById('total-pages').textContent = '1';
                document.getElementById('btn-prev').disabled = true;
                document.getElementById('btn-next').disabled = true;
                return;
            }
            
            const totalPages = Math.ceil(category.children.length / state.itemsPerPage);
            document.getElementById('current-page').textContent = state.currentPage;
            document.getElementById('total-pages').textContent = totalPages;
            
            document.getElementById('btn-prev').disabled = state.currentPage <= 1;
            document.getElementById('btn-next').disabled = state.currentPage >= totalPages;
        }

        function prevPage() {
            if (state.currentPage > 1) {
                state.currentPage--;
                renderItems();
                updatePagination();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function nextPage() {
            const category = archiveData.find(c => c.id === state.currentCategory);
            if (!category) return;
            
            const totalPages = Math.ceil(category.children.length / state.itemsPerPage);
            if (state.currentPage < totalPages) {
                state.currentPage++;
                renderItems();
                updatePagination();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // ==========================================
        // 最近浏览
        // ==========================================
        function addRecent(name, path, icon) {
            // 移除重复项
            state.recentViews = state.recentViews.filter(r => r.path !== path);
            // 添加到开头
            state.recentViews.unshift({ name, path, icon, time: Date.now() });
            // 最多保留10个
            state.recentViews = state.recentViews.slice(0, 10);
            // 保存
            localStorage.setItem('recentViews', JSON.stringify(state.recentViews));
            renderRecentViews();
        }

        function renderRecentViews() {
            const section = document.getElementById('recent-section');
            const list = document.getElementById('recent-list');
            
            if (state.recentViews.length === 0) {
                section.classList.add('hidden');
                return;
            }
            
            section.classList.remove('hidden');
            list.innerHTML = '';
            
            state.recentViews.forEach(item => {
                const card = document.createElement('a');
                card.href = item.path;
                card.className = 'flex-shrink-0 w-32 bg-white rounded-xl p-3 border border-primary-100 hover:shadow-md transition-all hover:border-primary-200';
                card.innerHTML = `
                    <div class="text-2xl mb-2 text-center">${item.icon || '📄'}</div>
                    <div class="text-xs font-medium text-gray-700 truncate text-center">${item.name}</div>
                `;
                list.appendChild(card);
            });
        }

        // ==========================================
        // 搜索功能 - 基于标题/文件名
        // ==========================================
        function toggleSearch() {
            const bar = document.getElementById('search-bar');
            const input = document.getElementById('search-input');
            bar.classList.toggle('open');
            if (bar.classList.contains('open')) {
                setTimeout(() => input.focus(), 100);
            } else {
                closeSearch();
            }
        }

        function closeSearch() {
            document.getElementById('search-bar').classList.remove('open');
            document.getElementById('search-results').classList.add('hidden');
            document.getElementById('search-input').value = '';
            state.searchQuery = '';
        }

        function performSearch(query) {
            if (!query.trim()) {
                document.getElementById('search-results').classList.add('hidden');
                return;
            }
            
            const results = [];
            const lowerQuery = query.toLowerCase();
            
            archiveData.forEach(category => {
                category.children.forEach(item => {
                    const matchName = item.name.toLowerCase().includes(lowerQuery);
                    const matchId = item.id.toLowerCase().includes(lowerQuery);
                    
                    if (matchName || matchId) {
                        results.push({
                            ...item,
                            categoryName: category.name,
                            categoryIcon: category.icon
                        });
                    }
                    
                    // 搜索子项
                    if (item.subItems) {
                        item.subItems.forEach(sub => {
                            if (sub.toLowerCase().includes(lowerQuery)) {
                                results.push({
                                    name: sub,
                                    path: item.path,
                                    pages: 1,
                                    categoryName: category.name,
                                    categoryIcon: category.icon,
                                    isSubItem: true,
                                    parentName: item.name
                                });
                            }
                        });
                    }
                });
            });
            
            renderSearchResults(results, query);
        }

        function renderSearchResults(results, query) {
            const container = document.getElementById('results-container');
            const resultsDiv = document.getElementById('search-results');
            
            if (results.length === 0) {
                container.innerHTML = `
                    <div class="p-4 text-center text-gray-500">
                        <i class="fas fa-search mb-2 text-2xl text-gray-300"></i>
                        <p>未找到相关内容</p>
                    </div>
                `;
                resultsDiv.classList.remove('hidden');
                return;
            }
            
            let html = `<div class="p-2 text-xs text-gray-500 border-b border-gray-100">找到 ${results.length} 个结果</div>`;
            
            results.forEach(item => {
                const highlightedName = highlightText(item.name, query);
                const pageLinks = item.pages > 1 
                    ? Array.from({length: item.pages}, (_, i) => 
                        `<a href="${item.path.endsWith('/') ? item.path + (i+1) + '.html' : item.path}" 
                            onclick="addRecent('${item.name}', '${item.path}', '${item.categoryIcon}')"
                            class="text-xs px-2 py-1 rounded bg-primary-50 text-primary-600 hover:bg-primary-100">${i+1}</a>`
                      ).join('')
                    : `<a href="${item.path}" onclick="addRecent('${item.name}', '${item.path}', '${item.categoryIcon}')" class="text-xs px-2 py-1 rounded bg-primary-50 text-primary-600 hover:bg-primary-100">阅读</a>`;
                
                html += `
                    <div class="p-3 hover:bg-primary-50 border-b border-gray-50 last:border-0 transition-colors">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-sm">${item.categoryIcon}</span>
                            <span class="text-xs text-gray-400">${item.categoryName}</span>
                            ${item.isSubItem ? `<span class="text-xs text-gray-300">← ${item.parentName}</span>` : ''}
                        </div>
                        <div class="font-medium text-gray-800 mb-2 text-sm">${highlightedName}</div>
                        <div class="flex gap-2">${pageLinks}</div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            resultsDiv.classList.remove('hidden');
        }

        function highlightText(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${escapeRegex(query)})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        function escapeRegex(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // ==========================================
        // 阅读进度条
        // ==========================================
        function updateReadingProgress() {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById('reading-progress').style.width = scrolled + '%';
            
            // 返回顶部按钮
            const backToTop = document.getElementById('backToTop');
            if (winScroll > 300) {
                backToTop.classList.add('show');
            } else {
                backToTop.classList.remove('show');
            }
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ==========================================
        // 事件监听
        // ==========================================
        function setupEventListeners() {
            // 滚动事件
            let scrollTimeout;
            window.addEventListener('scroll', () => {
                if (scrollTimeout) return;
                scrollTimeout = setTimeout(() => {
                    updateReadingProgress();
                    scrollTimeout = null;
                }, 10);
            });
            
            // 搜索输入
            const searchInput = document.getElementById('search-input');
            let searchTimeout;
            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    state.searchQuery = e.target.value;
                    performSearch(e.target.value);
                }, 300);
            });
            
            // 点击外部关闭搜索
            document.addEventListener('click', (e) => {
                const searchBar = document.getElementById('search-bar');
                const searchBtn = e.target.closest('button[onclick="toggleSearch()"]');
                if (!searchBar.contains(e.target) && !searchBtn) {
                    closeSearch();
                }
            });
            
            // 键盘快捷键
            document.addEventListener('keydown', (e) => {
                // ESC关闭侧边栏和搜索
                if (e.key === 'Escape') {
                    document.getElementById('sidebar').classList.remove('open');
                    document.getElementById('sidebar-overlay').classList.remove('open');
                    closeSearch();
                }
                // / 打开搜索
                if (e.key === '/' && !e.ctrlKey && !e.metaKey) {
                    if (document.activeElement.tagName !== 'INPUT') {
                        e.preventDefault();
                        toggleSearch();
                    }
                }
            });
        }

        // 防止iOS橡皮筋效果
        document.addEventListener('touchmove', function(e) {
            if (e.target.closest('#sidebar')) return;
        }, { passive: true });
    </script>
</body>
</html>
